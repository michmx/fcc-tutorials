name: Publish

on:
  push:
    branches:
    - main

jobs:
  jupyter-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install Requirements
      run: |
        pip3 install -r requirements.txt
    - name: Jupyter Book build
      env:
        # The site is served from <site>/main/, see the redirect below
        BASE_URL: /${{ github.event.repository.name }}/main
      run: |
        jupyter book build --html
        mkdir build
        cp -r _build/html build/main
    - name: Publish gh-pages
      run: |
        cd build
        cp -r main master
        git init
        git config user.name "FCCSW Bot"
        git config user.email "fccsw.bot@example.com"
        git remote add upstream https://kjvbrt:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git

        touch .nojekyll
        git add .nojekyll
        git commit -m "Initial commit"
        git branch -m gh-pages
        touch .
        cp ../.github/aux/gh-pages-redirect.html index.html
        git add -A .
        git commit -m "Rebuild page at ${GITHUB_SHA}"
        git push -f upstream gh-pages:gh-pages
